<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">Distributed MQTT weather processing architecture</title><desc id="desc">Weather stations publish to MQTT. Subscribers process the same stream as local MapReduce batches, stateful windows and threaded analytics.</desc><rect width="1200" height="410" fill="#0d1117"/><style>.b{fill:#161b22;stroke:#58a6ff;stroke-width:2;rx:14}.g{fill:#161b22;stroke:#3fb950;stroke-width:2;rx:14}.o{fill:#161b22;stroke:#d29922;stroke-width:2;rx:14}.t{fill:#f0f6fc;font:600 17px system-ui,-apple-system,Segoe UI,sans-serif}.s{fill:#8b949e;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.l{stroke:#8b949e;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker></defs><text x="35" y="42" class="t">MQTT weather-processing lab</text><text x="35" y="68" class="s">One telemetry stream, three computation models</text><rect x="35" y="140" width="180" height="90" class="b"/><text x="65" y="175" class="t">Weather Stations</text><text x="71" y="200" class="s">WS-001 … WS-005</text><rect x="280" y="140" width="180" height="90" class="b"/><text x="330" y="175" class="t">MQTT</text><text x="305" y="200" class="s">stasiun/cuaca/#</text><rect x="535" y="80" width="205" height="90" class="g"/><text x="575" y="115" class="t">Batch / MapReduce</text><text x="575" y="140" class="s">buffer → group → reduce</text><rect x="535" y="190" width="205" height="90" class="g"/><text x="578" y="225" class="t">Stream Windows</text><text x="566" y="250" class="s">per-station state + alerts</text><rect x="535" y="300" width="205" height="90" class="g"/><text x="572" y="335" class="t">Thread Pool</text><text x="565" y="360" class="s">fan-out + locked merge</text><rect x="830" y="135" width="310" height="140" class="o"/><text x="870" y="170" class="t">Analytics / operational questions</text><text x="870" y="198" class="s">latency · aggregation · alerts</text><text x="870" y="222" class="s">state isolation · ordering</text><text x="870" y="246" class="s">concurrency · failure semantics</text><path d="M215 185 H280" class="l"/><path d="M460 185 C500 160 500 125 535 125" class="l"/><path d="M460 185 H535" class="l"/><path d="M460 185 C500 250 500 345 535 345" class="l"/><path d="M740 125 C780 135 790 165 830 175" class="l"/><path d="M740 235 H830" class="l"/><path d="M740 345 C780 325 790 250 830 235" class="l"/></svg>